<!--
  Horizon landing page, loop 3: conversation-ribbon ("the whole conversation": RFQ to sales order in one thread)
  Rebuilt Nov 4 2026 on the shipped Projects UI (dark, Inter 300, kit horizon-ui.css): the Larkspur Implement Co. project page.
  Design size 1200x750, scales to the root width. Loop length 40.0s. Replays WALKTHROUGHS.md sections 5, 6 and 7 (through
  "Created sales order"). Nobody types a prompt, nobody clicks Send; the two sends happen off screen ("a person sent it").

  Layout: white canvas, lime dot top-left, Horizon window inset 30px (1140x690): OS title bar, nav rail, project header
  (logo tile, Larkspur Implement Co., 10 Parts, Tessa Brandvold, status pill, presence avatar P), project rail (All Projects,
  stage header with the big figure and the 4-segment RFQ Quote PO Sales Order bar, stage details card, Quoted Items with
  3 rows + All 10), the thread in the center (no right column), composer. One canvas caption under the window.

  Beats (seconds; every new thread item rises 6px / 350ms, the thread scrolls 600ms, rail and pill update 0.4s after):
    0.0  resolved: the whole thread, ending on "Passed contract review" and "Created sales order SO3318 in Fulcrum";
         rail "Sales Order · $54,501.00 · SO3318 · PO 77812-R1", all four segments lit, pill Ordered (hold 3.0s)
    3.0  reset: thread fades out (0.4s); rail returns to "RFQ · Reading 10 parts", pill Processing
    3.5  Thu Oct 29 · Tessa's RFQ email "Request for quote - LA-400 lift arm parts", 8:12 AM, two attachments
    6.2  the run fold "Read the RFQ and estimated all 10 parts · 3 steps · all automated · 8:12 AM to 8:15 AM · Show Reasoning"
    6.9  Parts table (compact: 3 of 10 lines, LI-2140 unit and lead time in red)       7.3 rail figure "10 of 10 priced"
    9.6  Horizon's post: drafted quote email to Tessa, Quote-2207.pdf, Send + Not Now    10.0 rail "Quote · $59,241.00 · not sent", pill Ready
   12.3  a person sent it: the post reads "Sent · 10:54 AM"                              12.7 rail "Quote 2207 · sent", pill Sent
   15.0  Tessa's reply, 11:40 AM: 100 kits, split ship is fine, "closer to $54,500?"
   17.7  Horizon step "Worked out the margin at $54,500." 26.5%, under the 28% floor
   18.2  Needs You card "Tessa Asked for About $54,500": At 8% Off $54,501.00 / Margin 26.5% / Likely Real Margin ~28%,
         evidence, "Recommend: accept 8% off", Send Acceptance + Counter at 5% + Edit
   20.9  "Sent to Tessa at $54,501.00" (Quote 2207 Rev 1)                               21.3 rail "$54,501.00 · Quote 2207 Rev 1 · sent"
   23.6  Mon Nov 2 · Tessa's PO 77812 email, 7:48 AM, PO-77812.pdf                       24.0 rail "PO · PO 77812", pill PO Received
   26.3  table "PO 77812 vs Quote 2207 Rev 1 · 1 Line Missing" (LI-2131 Gusset Angle, $760.00)
   29.0  Horizon's post: drafted ask for a revised PO, Send + Not Now
   31.7  a person sent it: "Sent · 7:50 AM"      32.5  Tessa, 8:30 AM: "Good catch, thanks. Revised PO 77812-R1 attached."
   35.2  Horizon step "Passed contract review." 9 checks
   36.5  Horizon step "Created sales order SO3318 in Fulcrum."                           36.9 rail "Sales Order · SO3318", pill Ordered
   40.0  loop -> 0 (resolved state holds 3.1s at the end + 3.0s at the start)

  ?still=1  resolved state, stopped.   ?at=<sec>  seeks to that second and stops.   prefers-reduced-motion: resolved only.
  In-view gating: the timeline pauses (keeps its place) when the root is under 10% visible or the tab is hidden.

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
/* ---------- root + stage ---------- */
.hz-conversation-ribbon { --s: 1; --ease: cubic-bezier(.2,.7,.2,1); position: relative; display: block; width: 100%; overflow: hidden;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #292932; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  pointer-events: none; user-select: none; }
.hz-conversation-ribbon *, .hz-conversation-ribbon *::before, .hz-conversation-ribbon *::after { box-sizing: border-box; }
.hz-conversation-ribbon-stage { position: absolute; left: 0; top: 0; width: 1200px; height: 750px; overflow: hidden; background: #131418;
  transform-origin: 0 0; transform: scale(var(--s)); }
.hz-conversation-ribbon .cr-win { position: absolute; left: 0; top: 0; width: 1200px; height: 750px;  
   background: #131418; overflow: hidden; display: flex; flex-direction: column; }
.hz-conversation-ribbon .cr-os { flex: none; height: 36px; background: #1b1d23; display: flex; align-items: center; justify-content: center; position: relative;
  font-size: 12.5px; color: #a9abae; font-weight: 400; }
.hz-conversation-ribbon .cr-os i { position: absolute; left: 14px; top: 12.5px; width: 11px; height: 11px; border-radius: 50%; background: #4b4d53; }
.hz-conversation-ribbon .cr-os i + i { left: 31px; } .hz-conversation-ribbon .cr-os i + i + i { left: 48px; }

/* ---------- Horizon UI kit (horizon-ui.css, trimmed to what this loop uses) ---------- */
.hz-conversation-ribbon { --app: #131418; --list: #191a1f; --card: #191a1f; --line: #2b2d33; --line2: #3b3d43; --edge2: #4b4d53;
  --fg: #e6e6f0; --fg-strong: #f2f2f8; --mute: rgba(230,230,240,.6); --mute2: rgba(230,230,240,.72); --mute3: rgba(230,230,240,.55);
  --link: #6788ff; --dot: #6788ff; --send: #3f6fe0; --avatar: #8a8f3a; --active-bg: #162d55;
  --spark-bg: #2a2740; --spark-fg: #c4baf5; --why: #7a68d6; --warn: #cf976a; --bad: #e0948a; --good-fg: #6da885;
  --info-bg: #1f2a3a; --info-fg: #8fa8ff; --warn-bg: #452c17; --warn-fg: #c18b5e; --tag-bg: #323335; --tag-fg: #a9abae; --ok-bg: #1d3a2a; --ok-fg: #6da885;
  --font: "Horizon Inter", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
.hz-conversation-ribbon .hzk-app { display: flex; flex: 1 1 auto; min-height: 0; width: 100%; background: var(--app); color: var(--fg); font-family: var(--font);
  font-weight: 300; font-size: 14px; line-height: 1.5; overflow: hidden; }
.hz-conversation-ribbon .hzk-app button { font: inherit; color: inherit; cursor: default; }
.hz-conversation-ribbon .hzk-rail { width: 72px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px; border-right: 1px solid var(--line); }
.hz-conversation-ribbon .hzk-rail-item { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border: 0; border-radius: 8px; background: none; color: var(--mute2); font-size: 11px; letter-spacing: -.02em; white-space: nowrap; }
.hz-conversation-ribbon .hzk-rail-item.is-on { background: var(--active-bg); color: var(--link); }
.hz-conversation-ribbon .hzk-app .hzk-rail-item { font-size: 11px; font-weight: 500; letter-spacing: -.01em; line-height: 1.2; white-space: nowrap; }
.hz-conversation-ribbon .hzk-rail-item svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hz-conversation-ribbon .hzk-rail-spacer { flex: 1 1 auto; }
.hz-conversation-ribbon .hzk-pill { flex: none; padding: 0 8px; border-radius: 12px; line-height: 20px; font-size: 11px; font-weight: 600; background: var(--tag-bg); color: var(--tag-fg); white-space: nowrap; }
.hz-conversation-ribbon .hzk-pill.ready { background: #0d2d3b; color: #78a6bd; }
.hz-conversation-ribbon .hzk-pill.sent { background: var(--ok-bg); color: var(--ok-fg); }
.hz-conversation-ribbon .hzk-pill.po { background: #202f6a; color: #8493c1; }
.hz-conversation-ribbon .hzk-pill.ordered { background: #1e2e14; color: #8db177; }
.hz-conversation-ribbon .hzk-pill.info { background: var(--info-bg); color: var(--info-fg); }
.hz-conversation-ribbon .hzk-pill.good { background: rgba(16,163,116,.18); color: var(--good-fg); }
.hz-conversation-ribbon .hzk-pill.bad { background: rgba(192,57,43,.22); color: var(--bad); }
.hz-conversation-ribbon .hzk-tag { display: inline-block; padding: 0 8px; border-radius: 10px; line-height: 19px; font-size: 11px; font-weight: 600; background: var(--info-bg); color: var(--info-fg); white-space: nowrap; }
.hz-conversation-ribbon .hzk-tag.mute { background: var(--tag-bg); color: var(--tag-fg); }
.hz-conversation-ribbon .hzk-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); display: inline-block; flex: none; }
.hz-conversation-ribbon .hzk-composer { flex: none; margin-top: auto; height: 48px; border: 1px solid var(--edge2); border-radius: 8px; background: #1b1d23; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; color: var(--mute); font-size: 15px; }
.hz-conversation-ribbon .hzk-composer span { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hz-conversation-ribbon .hzk-composer i { width: 32px; height: 32px; border-radius: 8px; background: #2a2d36; color: var(--mute3); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.hz-conversation-ribbon .hzk-stagehead { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
.hz-conversation-ribbon .hzk-stagehead .k { display: flex; align-items: center; font-size: 13px; color: var(--mute2); }
.hz-conversation-ribbon .hzk-stagehead .k a { margin-left: auto; color: var(--link); font-size: 12.5px; }
.hz-conversation-ribbon .hzk-stagehead .fig { font-size: 24px; font-weight: 500; line-height: 28px; color: var(--fg-strong); font-variant-numeric: tabular-nums; }
.hz-conversation-ribbon .hzk-stagehead .sub { font-size: 12.5px; color: var(--mute); }
.hz-conversation-ribbon .hzk-stagehead .sub a { color: var(--link); }
.hz-conversation-ribbon .hzk-prog { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px; }
.hz-conversation-ribbon .hzk-prog i { height: 3px; border-radius: 2px; background: var(--line2); display: block; }
.hz-conversation-ribbon .hzk-prog i.on { background: var(--link); }
.hz-conversation-ribbon .hzk-detail { margin: 12px; border: 1px solid var(--line2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.hz-conversation-ribbon .hzk-detail div { display: flex; justify-content: space-between; gap: 10px; }
.hz-conversation-ribbon .hzk-detail span { color: var(--mute); }
.hz-conversation-ribbon .hzk-detail b { font-weight: 500; color: var(--fg); text-align: right; }
.hz-conversation-ribbon .hzk-detail b.warn { color: var(--warn); }
.hz-conversation-ribbon .hzk-detail b a { color: var(--link); }
.hz-conversation-ribbon .hzk-run { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; }
.hz-conversation-ribbon .hzk-run .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--spark-bg); color: var(--spark-fg); }
.hz-conversation-ribbon .hzk-run .fold { font-size: 14px; font-weight: 500; color: var(--fg); }
.hz-conversation-ribbon .hzk-run .fold small { display: block; font-size: 12px; font-weight: 300; color: var(--mute); margin-top: 2px; }
.hz-conversation-ribbon .hzk-run .fold small a { color: var(--link); }
.hz-conversation-ribbon .hzk-post { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; }
.hz-conversation-ribbon .hzk-post .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--spark-bg); color: var(--spark-fg); }
.hz-conversation-ribbon .hzk-post .box { border: 1px solid var(--line2); border-radius: 8px; background: var(--card); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.hz-conversation-ribbon .hzk-post .box .hd { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--mute2); }
.hz-conversation-ribbon .hzk-post .box .hd b { font-size: 14px; font-weight: 500; color: var(--fg-strong); }
.hz-conversation-ribbon .hzk-post .box .hd small { margin-left: auto; font-size: 11.5px; color: var(--mute3); }
.hz-conversation-ribbon .hzk-post .box .body { font-size: 13.5px; line-height: 1.55; color: rgba(230,230,240,.88); white-space: pre-line; }
.hz-conversation-ribbon .hzk-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hz-conversation-ribbon .hzk-btn { height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--edge2); background: transparent; color: var(--fg); font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; }
.hz-conversation-ribbon .hzk-btn.primary { background: var(--send); border-color: var(--send); color: #fff; }
.hz-conversation-ribbon .hzk-result { font-size: 13px; color: var(--good-fg); display: flex; align-items: center; gap: 8px; min-height: 28px; }
.hz-conversation-ribbon .hzk-result small { font-size: 12px; color: var(--mute3); }
.hz-conversation-ribbon .hzk-mail { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; }
.hz-conversation-ribbon .hzk-mail .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: #323335; color: #a9abae; }
.hz-conversation-ribbon .hzk-mail .card { border: 1px solid var(--line2); border-radius: 8px; background: var(--card); padding: 12px 14px; }
.hz-conversation-ribbon .hzk-mail .hd { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--mute2); }
.hz-conversation-ribbon .hzk-mail .hd b { color: var(--fg-strong); font-weight: 500; font-size: 13.5px; }
.hz-conversation-ribbon .hzk-mail .hd small { margin-left: auto; font-size: 11.5px; color: var(--mute3); white-space: nowrap; }
.hz-conversation-ribbon .hzk-mail .sub { font-size: 14px; font-weight: 500; margin-top: 4px; }
.hz-conversation-ribbon .hzk-mail .body { margin-top: 4px; font-size: 13.5px; line-height: 1.55; color: rgba(230,230,240,.85); white-space: pre-line; }
.hz-conversation-ribbon .hzk-mail .atts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.hz-conversation-ribbon .hzk-mail .att, .hz-conversation-ribbon .hzk-post .att { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; border-radius: 8px; border: 1px solid var(--line2); background: #1e2026; font-size: 12.5px; font-weight: 600; color: var(--fg); }
.hz-conversation-ribbon .hzk-post .att { align-self: flex-start; }
.hz-conversation-ribbon .att i { width: 30px; height: 24px; border-radius: 4px; background: #fbfbf8; display: block; position: relative; overflow: hidden; flex: none; }
.hz-conversation-ribbon .att i::before { content: ''; position: absolute; left: 5px; right: 5px; top: 4px; height: 3px; background: #2a2d33; border-radius: 1px; box-shadow: 0 5px 0 -1px #c9cac4, 0 10px 0 -1px #c9cac4, 0 15px 0 -1px #c9cac4; }
.hz-conversation-ribbon .att small { font-weight: 400; color: var(--mute3); font-size: 11.5px; margin-left: 4px; }
.hz-conversation-ribbon .hzk-step { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; }
.hz-conversation-ribbon .hzk-step .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--spark-bg); color: var(--spark-fg); }
.hz-conversation-ribbon .hzk-step .t { font-size: 13.5px; font-weight: 500; }
.hz-conversation-ribbon .hzk-step .d { font-size: 13px; color: rgba(230,230,240,.75); }
.hz-conversation-ribbon .hzk-step .m { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; font-size: 11.5px; color: rgba(230,230,240,.58); }
.hz-conversation-ribbon .hzk-step .m a { color: var(--link); }
.hz-conversation-ribbon .hzk-table { border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; background: var(--card); }
.hz-conversation-ribbon .hzk-table .th { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line2); }
.hz-conversation-ribbon .hzk-table .th b { font-size: 14px; font-weight: 600; color: var(--fg-strong); flex: 1 1 auto; }
.hz-conversation-ribbon .hzk-table .th small { font-size: 12px; color: var(--mute); }
.hz-conversation-ribbon .hzk-table .th .hzk-pill { line-height: 22px; font-size: 12px; padding: 0 8px; border-radius: 10px; }
.hz-conversation-ribbon .hzk-table .tr { display: grid; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12.5px; align-items: center; }
.hz-conversation-ribbon .hzk-table .tr.head { font-size: 11.5px; color: var(--mute); border-top: 0; padding-bottom: 6px; }
.hz-conversation-ribbon .hzk-table .tr.bad { background: rgba(192,57,43,.1); }
.hz-conversation-ribbon .hzk-table .tr .r { text-align: right; font-variant-numeric: tabular-nums; }
.hz-conversation-ribbon .hzk-table .tr .r.bad, .hz-conversation-ribbon .hzk-table .tr .bad-fg { color: var(--bad); }
.hz-conversation-ribbon .hzk-table .tr .sub { display: block; font-size: 11.5px; color: var(--mute); }
.hz-conversation-ribbon .hzk-table .tr .sub.bad { color: var(--bad); }
.hz-conversation-ribbon .hzk-table .tr .pn { font-weight: 500; color: var(--fg); }
.hz-conversation-ribbon .hzk-table .tr .pn em { font-style: normal; font-weight: 300; color: var(--mute); }
.hz-conversation-ribbon .hzk-table .foot { padding: 8px 14px 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--mute2); }
.hz-conversation-ribbon .hzk-table .foot a { color: var(--link); }
.hz-conversation-ribbon .hzk-decision { border: 1px solid var(--dot); border-radius: 10px; background: var(--list); overflow: hidden; }
.hz-conversation-ribbon .hzk-decision .hd { display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 12px 14px; border-bottom: 1px solid rgba(230,230,240,.08); }
.hz-conversation-ribbon .hzk-decision .hd .hzk-dot { margin-top: 8px; width: 8px; height: 8px; }
.hz-conversation-ribbon .hzk-decision .hd b { font-size: 15px; font-weight: 600; color: var(--fg-strong); }
.hz-conversation-ribbon .hzk-decision .hd .sub { font-size: 12.5px; color: var(--mute); }
.hz-conversation-ribbon .hzk-decision .hd small { font-size: 12px; color: var(--mute3); white-space: nowrap; }
.hz-conversation-ribbon .hzk-facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; padding: 12px 14px 0; }
.hz-conversation-ribbon .hzk-fact { padding: 8px 10px; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; display: flex; flex-direction: column; gap: 2px; }
.hz-conversation-ribbon .hzk-fact small { font-size: 11.5px; color: var(--mute); }

.hz-conversation-ribbon .hzk-evidence li { display: grid; grid-template-columns: 5px minmax(0,1fr); gap: 10px; align-items: baseline; }

.hz-conversation-ribbon .hzk-rec { margin: 12px 14px 0; font-size: 13.5px; font-weight: 600; color: var(--fg-strong); }
.hz-conversation-ribbon .hzk-limit { margin: 4px 14px 0; font-size: 12px; color: var(--warn); }
.hz-conversation-ribbon .hzk-decision .hzk-actions { padding: 12px 14px 14px; }
@keyframes hzk-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.hz-conversation-ribbon .hzk-in { animation: hzk-rise .35s ease-out both; }

/* ---------- this loop's own pieces (project page chrome) ---------- */
.hz-conversation-ribbon .cr-body { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.hz-conversation-ribbon .cr-head { flex: none; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }

.hz-conversation-ribbon .cr-head h1 { margin: 0; font-size: 19px; font-weight: 500; color: var(--fg-strong); white-space: nowrap; }
